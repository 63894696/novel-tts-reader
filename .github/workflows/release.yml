name: Release zip

# On every `v*` tag push:
#   1. Bundle the framework as a .zip (scripts/pack.js)
#   2. Upload the .zip as a workflow artifact (for build inspection)
#   3. Create a GitHub Release for the tag and attach the .zip

on:
  push:
    tags:
      - "v*"

# Creating Releases requires write access to the repo contents.
# (The default GITHUB_TOKEN is read-only.)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Force all JavaScript actions in this workflow to use Node.js 24.
      # actions/checkout@v4 still defaults to Node 20, which is deprecated
      # and will be removed from GitHub-hosted runners on 2026-09-16.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Bundle zip (STORE mode, preserves directory structure)
        run: |
          # Use the in-repo pack.js. It skips missing files with a warning,
          # so it works for both the public framework (no site adapters) and
          # private builds that drop in additional adapters.
          node scripts/pack.js . novel-tts-reader-${{ github.ref_name }}.zip

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-tts-reader-${{ github.ref_name }}
          path: novel-tts-reader-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Title defaults to the tag name (e.g. v0.7.0).
          # Auto-generate release notes from merged PRs + commits since last tag.
          generate_release_notes: true
          files: novel-tts-reader-${{ github.ref_name }}.zip
