name: Release zip

# Auto-build a publishable .zip whenever a tag like v1.2.3 is pushed.
# The .zip is uploaded to the GitHub release by the standard `actions/upload-release-asset`
# pattern, but we just attach it as a workflow artifact here — you can then
# download it from the Actions tab and attach it to a manually-created release,
# or use a third-party action like softprops/action-gh-release if you want
# fully automatic releases.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Force all JavaScript actions in this workflow to use Node.js 24.
      # actions/checkout@v4 still defaults to Node 20, which is deprecated
      # and will be removed from GitHub-hosted runners on 2026-09-16.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Bundle zip (STORE mode, preserves directory structure)
        run: |
          # Use the in-repo pack.js. It skips missing files with a warning,
          # so it works for both the public framework (no site adapters) and
          # private builds that drop in additional adapters.
          node scripts/pack.js . novel-tts-reader-${{ github.ref_name }}.zip

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-tts-reader-${{ github.ref_name }}
          path: novel-tts-reader-${{ github.ref_name }}.zip
          if-no-files-found: error
